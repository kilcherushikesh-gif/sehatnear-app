<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SehatNear Admin — Claim Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3F1; --surface:#FFFFFF; --ink:#12302E; --ink-soft:#4B615F; --ink-faint:#7C8E8B;
    --teal:#0E6B5C; --teal-dark:#084A40; --teal-wash:#E3EEEA;
    --red:#B3402A; --red-wash:#F5E4DF; --amber:#8A5A16; --amber-wash:#F2E7D3;
    --line:#DCE3E0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); font-family:'Public Sans', sans-serif; color:var(--ink); }
  h1,h2,h3{ font-family:'Fraunces', serif; font-weight:600; margin:0; }
  .app{ display:flex; min-height:100vh; }
  .sidebar{
    width:220px; background:var(--surface); border-right:1px solid var(--line);
    padding:22px 16px; flex:0 0 auto;
  }
  .brand{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; padding:0 8px 22px; }
  .navitem{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:10px;
    font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; margin-bottom:2px;
  }
  .navitem.active{ background:var(--teal-wash); color:var(--teal-dark); }
  .navitem .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); margin-left:auto; }

  .main{ flex:1; padding:28px 36px; max-width:980px; }
  .topline{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; }
  .topline p{ font-size:13px; color:var(--ink-faint); margin-top:4px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px; }
  .stat{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .stat .n{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .stat .l{ font-size:12px; color:var(--ink-faint); margin-top:4px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .panel-head{ padding:16px 20px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px; }
  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11.5px; color:var(--ink-faint); font-weight:600; padding:10px 20px; border-bottom:1px solid var(--line); }
  td{ padding:14px 20px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:last-child td{ border-bottom:none; }
  .hname{ font-weight:600; }
  .harea{ color:var(--ink-faint); font-size:12px; margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:999px; display:inline-block; }
  .badge.pending{ background:var(--amber-wash); color:var(--amber); }
  .badge.approved{ background:var(--teal-wash); color:var(--teal-dark); }
  .badge.rejected{ background:var(--red-wash); color:var(--red); }
  .diffrow{ font-size:12.5px; margin-bottom:4px; }
  .diffrow .old{ color:var(--ink-faint); text-decoration:line-through; }
  .diffrow .new{ color:var(--teal-dark); font-weight:600; }
  .actions{ display:flex; gap:8px; }
  .btn{ border:none; cursor:pointer; font-family:'Public Sans',sans-serif; font-weight:600; font-size:12.5px; border-radius:9px; padding:8px 12px; }
  .btn-approve{ background:var(--teal); color:#fff; }
  .btn-reject{ background:transparent; border:1px solid var(--line); color:var(--red); }
  .btn:disabled{ opacity:0.45; cursor:default; }
  .empty{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">SehatNear Admin</div>
    <div class="navitem active">Pending claims<span class="dot"></span></div>
    <div class="navitem">Verified hospitals</div>
    <div class="navitem">Data sources</div>
    <div class="navitem">Settings</div>
  </div>

  <div class="main">
    <div class="topline">
      <div>
        <h1 style="font-size:20px;">Hospital claim review</h1>
        <p>Corrections a hospital submits sit here until someone on your team confirms them — nothing is shown to users automatically.</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="panel">
      <div class="panel-head">Pending submissions</div>
      <table>
        <thead>
          <tr><th>Hospital</th><th>Submitted by</th><th>Requested changes</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="claimsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let claims = [
  {
    id: 1, name:"Sahyadri City Care Hospital", area:"Shivajinagar, Pune",
    submittedBy:"admin@sahyadricitycare.example", status:"pending",
    changes:[
      { field:"Help desk phone", old:"020-6120-1000", new:"020-6120-1050" },
      { field:"Departments", old:"Emergency, Cardiology, Orthopaedics, General medicine", new:"Emergency, Cardiology, Orthopaedics, General medicine, Nephrology" }
    ]
  },
  {
    id: 2, name:"Deccan Sunrise Hospital", area:"Deccan Gymkhana, Pune",
    submittedBy:"frontdesk@deccansunrise.example", status:"pending",
    changes:[
      { field:"24x7 emergency", old:"No", new:"Yes" },
      { field:"Hours", old:"OPD 8am–9pm", new:"24x7" }
    ]
  },
  {
    id: 3, name:"Wakad Community Hospital", area:"Wakad, Pune",
    submittedBy:"office@wakadcommunity.example", status:"approved",
    changes:[ { field:"Help desk phone", old:"020-6120-2200", new:"020-6120-2255" } ]
  }
];

function renderStats(){
  const pending = claims.filter(c=>c.status==='pending').length;
  const approved = claims.filter(c=>c.status==='approved').length;
  const rejected = claims.filter(c=>c.status==='rejected').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${pending}</div><div class="l">Awaiting review</div></div>
    <div class="stat"><div class="n">${approved}</div><div class="l">Approved this week</div></div>
    <div class="stat"><div class="n">${rejected}</div><div class="l">Rejected this week</div></div>
  `;
}

function renderClaims(){
  const body = document.getElementById('claimsBody');
  if(claims.length === 0){
    body.innerHTML = `<tr><td colspan="5"><div class="empty">No claims yet.</div></td></tr>`;
    return;
  }
  body.innerHTML = claims.map(c => `
    <tr>
      <td><div class="hname">${c.name}</div><div class="harea">${c.area}</div></td>
      <td style="color:var(--ink-faint)">${c.submittedBy}</td>
      <td>${c.changes.map(ch=>`
        <div class="diffrow">${ch.field}: <span class="old">${ch.old}</span> → <span class="new">${ch.new}</span></div>
      `).join('')}</td>
      <td><span class="badge ${c.status}">${c.status}</span></td>
      <td>
        <div class="actions">
          <button class="btn btn-approve" ${c.status!=='pending'?'disabled':''} onclick="setStatus(${c.id},'approved')">Approve</button>
          <button class="btn btn-reject" ${c.status!=='pending'?'disabled':''} onclick="setStatus(${c.id},'rejected')">Reject</button>
        </div>
      </td>
    </tr>
  `).join('');
}

function setStatus(id, status){
  claims = claims.map(c => c.id===id ? {...c, status} : c);
  renderStats();
  renderClaims();
}

renderStats();
renderClaims();
</script>
</body>
</html>
